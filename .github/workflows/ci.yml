name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      run: dotnet restore VKVideoDesktop.sln

    - name: Build
      run: msbuild VKVideoDesktop.sln /p:Configuration=Release /p:Platform="Any CPU" /v:minimal

    - name: Test
      run: dotnet test VKVideoDesktop.sln -c Release --no-build --verbosity normal

    - name: Publish
      run: msbuild src/VKVideoDesktop.App/VKVideoDesktop.App.csproj /p:Configuration=Release /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /t:Publish /v:minimal

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VKVideoDesktop-win-x64
        path: src/VKVideoDesktop.App/bin/Release/net9.0-windows10.0.22621.0/win-x64/publish/

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore VKVideoDesktop.sln

    - name: Build
      run: dotnet build VKVideoDesktop.sln -c Release --no-restore

    - name: Test
      run: dotnet test VKVideoDesktop.sln -c Release --no-build --verbosity normal

    - name: Publish
      run: dotnet publish src/VKVideoDesktop.App/VKVideoDesktop.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VKVideoDesktop-win-x64
        path: publish/
